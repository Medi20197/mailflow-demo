name: Déployer la démonstration sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Compiler la démonstration
        working-directory: frontend
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_DEMO_MODE: "true"
          VITE_PROFILE_URL: https://github.com/${{ github.repository_owner }}
        run: npm run build

      - name: Publier l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
